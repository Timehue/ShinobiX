# Dependabot version updates.
#
# Dependabot SECURITY updates were already enabled repo-side; this file adds the
# scheduled VERSION updates that were missing, so a CVE is not the only thing
# that ever moves a pin. Three sharp edges are encoded below:
#
#  1. NO `docker` ecosystem. The Node pin lives in ONE place — .nvmrc — which
#     every workflow reads via `node-version-file` and which local dev and
#     scripts/run-tests.mjs read too. The Dockerfile must repeat it as a literal
#     because a `FROM` line cannot read a file, so that repetition is the only
#     copy left, and scripts/check-deployment-config.test.mjs fails when the two
#     disagree. Dependabot can see only the Dockerfile, so it would bump that
#     half alone and turn the gate red. Node bumps stay manual: edit .nvmrc AND
#     both Dockerfile stages, in one commit.
#  2. Minor+patch are grouped into one PR per manifest. This repo pushes to main
#     many times a day; ungrouped updates would bury real work under bot PRs.
#  3. Majors arrive as their own PR, one at a time, on purpose — react/vite/
#     playwright majors have to clear the bundle-size and e2e gates, and those
#     are read one at a time or not at all.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      server-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /shinobij.client
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      client-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
