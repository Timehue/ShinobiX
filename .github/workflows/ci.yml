      - name: Verify and extract exact release artifact
        run: |
          cd .ci-artifacts/release
          sha256sum -c release-dist.tgz.sha256
          grep -Fx "sha=$GITHUB_SHA" provenance.txt
          grep -Fx "run_id=$GITHUB_RUN_ID" provenance.txt
          artifact_attempt="$(sed -n 's/^run_attempt=//p' provenance.txt)"
          [[ "$artifact_attempt" =~ ^[1-9][0-9]*$ ]]
          (( artifact_attempt <= GITHUB_RUN_ATTEMPT ))
          cd ../..
          tar -xzf .ci-artifacts/release/release-dist.tgz
          node scripts/verify-dist.mjs
      - name: Install combat browsers
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: ${{ matrix.browser }}
          log: .ci-evidence/e2e-combat-${{ matrix.shard }}/browser-install.log
      - name: Combat layout and jutsu-arming matrix
        env:
          COMBAT_LAYOUT_CAPTURE_PHASE: after
          COMBAT_LAYOUT_STRICT: "1"
          COMBAT_LAYOUT_ARTIFACT_ROOT: ${{ github.workspace }}/shinobij.client/test-results/combat-layout/captures/${{ matrix.shard }}
        run: npm run test:e2e:combat-layout --prefix shinobij.client -- ${{ matrix.projects }} 2>&1 | tee .ci-evidence/e2e-combat-${{ matrix.shard }}/playwright.log
      - name: Retain combat browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: evidence-e2e-combat-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-evidence/e2e-combat-${{ matrix.shard }}/
            shinobij.client/playwright-report/
            shinobij.client/test-results/combat-layout/
          if-no-files-found: warn
          retention-days: 14

  e2e_combat:
    name: CI / e2e-combat
    if: ${{ always() }}
    needs: e2e_combat_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every combat browser shard
        env:
          COMBAT_MATRIX: ${{ needs.e2e_combat_matrix.result }}
        run: |
          mkdir -p .ci-evidence/e2e-combat
          printf 'sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .ci-evidence/e2e-combat/provenance.txt
          printf 'e2e-combat-matrix=%s\n' "$COMBAT_MATRIX" | tee .ci-evidence/e2e-combat/results.log
          test "$COMBAT_MATRIX" = success
      - name: Retain combat aggregate evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: evidence-e2e-combat-aggregate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/e2e-combat/
          if-no-files-found: warn
          retention-days: 14

  e2e_warfront_matrix:
    name: CI / e2e-warfront / ${{ matrix.shard }}-of-2
    needs: release_artifact
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # All 52 applicable cases passed in 18.6 minutes, but setup and cleanup
    # exhausted the 29-minute job. Split the same seven-project inventory
    # across two runners, retaining the existing per-job ceiling.
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: shinobij.client/package-lock.json
      - name: Initialize evidence
        run: |
          mkdir -p .ci-evidence/e2e-warfront
          printf 'sha=%s\nrun_id=%s\nrun_attempt=%s\nshard=%s-of-2\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ matrix.shard }}" > .ci-evidence/e2e-warfront/provenance.txt
      - name: Require successful release artifact
        if: ${{ needs.release_artifact.result != 'success' }}
        run: |
          echo "release-artifact=${{ needs.release_artifact.result }}" | tee .ci-evidence/e2e-warfront/upstream-results.log
          exit 1
      - name: Install client dependencies
        run: npm ci --prefix shinobij.client 2>&1 | tee .ci-evidence/e2e-warfront/client-install.log
      - name: Download joined release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ github.sha }}-${{ github.run_id }}
          path: .ci-artifacts/release
      - name: Verify and extract exact release artifact
        run: |
          cd .ci-artifacts/release
          sha256sum -c release-dist.tgz.sha256
          grep -Fx "sha=$GITHUB_SHA" provenance.txt
          grep -Fx "run_id=$GITHUB_RUN_ID" provenance.txt
          artifact_attempt="$(sed -n 's/^run_attempt=//p' provenance.txt)"
          [[ "$artifact_attempt" =~ ^[1-9][0-9]*$ ]]
          (( artifact_attempt <= GITHUB_RUN_ATTEMPT ))
          cd ../..
          tar -xzf .ci-artifacts/release/release-dist.tgz
      - name: Install Warfront browser
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
          log: .ci-evidence/e2e-warfront/browser-install.log
      - name: Warfront positional-mode browser matrix
        run: npm run test:e2e:warfront --prefix shinobij.client -- --shard=${{ matrix.shard }}/2 2>&1 | tee .ci-evidence/e2e-warfront/playwright.log
      - name: Retain Warfront browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: evidence-e2e-warfront-${{ matrix.shard }}-of-2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-evidence/e2e-warfront/
            shinobij.client/playwright-report/
            shinobij.client/test-results/
            .playwright-mcp/aaa-adaptive/
          if-no-files-found: warn
          retention-days: 14

  e2e_warfront:
    name: CI / e2e-warfront
    needs: e2e_warfront_matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Warfront shard
        env:
          WARFRONT_SHARDS: ${{ needs.e2e_warfront_matrix.result }}
        run: |
          mkdir -p .ci-evidence/e2e-warfront
          printf 'warfront-shards=%s\n' "$WARFRONT_SHARDS" | tee .ci-evidence/e2e-warfront/shards.log
          test "$WARFRONT_SHARDS" = success
      - name: Retain Warfront aggregate evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: evidence-e2e-warfront-aggregate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .ci-evidence/e2e-warfront/
          if-no-files-found: warn
          retention-days: 14

  e2e_village_stores_matrix:
    name: CI / e2e-village-stores / ${{ matrix.shard }}-of-3
    needs: release_artifact
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Preserve all ten real-server commands while keeping setup plus journeys
    # below the existing 35-minute ceiling. Every child is required by the aggregate.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: shinobij.client/package-lock.json
      - name: Initialize evidence
        run: |
          mkdir -p .ci-evidence/e2e-village-stores
          printf 'sha=%s\nrun_id=%s\nrun_attempt=%s\nshard=%s-of-3\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${{ matrix.shard }}" > .ci-evidence/e2e-village-stores/provenance.txt
      - name: Require successful release artifact
        if: ${{ needs.release_artifact.result != 'success' }}
        run: |
          echo "release-artifact=${{ needs.release_artifact.result }}" | tee .ci-evidence/e2e-village-stores/upstream-results.log
          exit 1
      # playwright.live.config.ts boots the REAL Express server
      # (node ../dist/server.js), so this job needs the ROOT runtime deps —
      # api/_force-ipv4.ts and api/_storage.ts both pull in undici. Cloned
      # from e2e-warfront, which only serves a static vite preview and
      # therefore never needed them; without this the web server dies with
      # "Cannot find module 'undici'" before a single spec runs.
      - name: Install production server dependencies
        run: npm ci --omit=dev 2>&1 | tee .ci-evidence/e2e-village-stores/root-install.log
      - name: Install client dependencies
        run: npm ci --prefix shinobij.client 2>&1 | tee .ci-evidence/e2e-village-stores/client-install.log
      - name: Download joined release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ github.sha }}-${{ github.run_id }}
          path: .ci-artifacts/release
      - name: Verify and extract exact release artifact
        run: |
          cd .ci-artifacts/release
          sha256sum -c release-dist.tgz.sha256
          grep -Fx "sha=$GITHUB_SHA" provenance.txt
          grep -Fx "run_id=$GITHUB_RUN_ID" provenance.txt
          artifact_attempt="$(sed -n 's/^run_attempt=//p' provenance.txt)"
          [[ "$artifact_attempt" =~ ^[1-9][0-9]*$ ]]
          (( artifact_attempt <= GITHUB_RUN_ATTEMPT ))
          cd ../..
          tar -xzf .ci-artifacts/release/release-dist.tgz
      - name: Install live Express browser
        uses: ./.github/actions/playwright-browsers
        with:
          browsers: chromium
          log: .ci-evidence/e2e-village-stores/browser-install.log
      # Keep the required check name stable while covering the shared server
      # routing and save lifecycle used by the economy and Academy journeys.
      - name: Live Express economy, Academy persistence and route wiring
        if: ${{ matrix.shard == 1 }}
        run: npm run test:e2e:live --prefix shinobij.client -- village-stores-express.spec.ts first-session-onboarding-express.spec.ts server-route-smoke-express.spec.ts --project=chromium-desktop-live 2>&1 | tee .ci-evidence/e2e-village-stores/playwright.log
      # Each project creates 14 accounts including external healers and landing
      # restoration. Give each invocation a fresh server so the real 25/IP/15m
      # registration budget is respected while retaining every recovery case.
      - name: Live Express defeat, landing and daily recovery on desktop
        if: ${{ matrix.shard == 1 }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../.ci-evidence/e2e-village-stores/defeat-recovery-desktop.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../.ci-evidence/e2e-village-stores/defeat-recovery-desktop-html
        run: npm run test:e2e:live --prefix shinobij.client -- first-defeat-recovery-express.spec.ts landing-style-routing.spec.ts daily-login-recovery-express.spec.ts --project=chromium-desktop-live --workers=1 --retries=0 --forbid-only --reporter=line,json,html --output=test-results/defeat-recovery-ci-desktop 2>&1 | tee .ci-evidence/e2e-village-stores/defeat-recovery-desktop.log
      - name: Live Express defeat, landing and daily recovery on mobile
        if: ${{ matrix.shard == 2 }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ../.ci-evidence/e2e-village-stores/defeat-recovery-mobile.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: ../.ci-evidence/e2e-village-stores/defeat-recovery-mobile-html
        run: npm run test:e2e:live --prefix shinobij.client -- first-defeat-recovery-express.spec.ts landing-style-routing.spec.ts daily-login-recovery-express.spec.ts --project=chromium-mobile-live --workers=1 --retries=0 --forbid-only --reporter=line,json,html --output=test-results/defeat-recovery-ci-mobile 2>&1 | tee .ci-evidence/e2e-village-stores/defeat-recovery-mobile.log
      # Its own step, so its own server: registration is limited to 25 accounts
      # per IP per 15 minutes, and each recovery project has its own budget.
      - name: Live Express hospital ward and roaming Weekly Boss on desktop and mobile
        if: ${{ matrix.shard == 3 }}
        run: npm run test:e2e:live --prefix shinobij.client -- mmorpg-behaviors-express.spec.ts --project=chromium-desktop-live --project=chromium-mobile-live --workers=2 --output=test-results/mmo-behaviors-ci 2>&1 | tee .ci-evidence/e2e-village-stores/mmo-behaviors.log
      - name: Live Express authored missions on desktop and mobile
        if: ${{ matrix.shard == 3 }}
        run: npm run test:e2e:live --prefix shinobij.client -- authored-missions-express.spec.ts --project=chromium-desktop-live --project=chromium-mobile-live --output=test-results/authored-missions-ci 2>&1 | tee .ci-evidence/e2e-village-stores/authored-missions.log
      - name: Live Express PvP cancellation, settlement, ranked and Kage journeys
        if: ${{ matrix.shard == 3 }}
        env:
          LIVE_E2E_REALTIME: '1'
        run: npm run test:e2e:live --prefix shinobij.client -- pvp-lifecycle-express.spec.ts ranked-queue-express.spec.ts kage-challenge-express.spec.ts --project=chromium-desktop-live --project=chromium-mobile-live --output=test-results/pvp-lifecycle-ci 2>&1 | tee .ci-evidence/e2e-village-stores/pvp-lifecycle.log
      # Wild pet binding rides on this server: the step registers 12 of the 25
      # accounts per IP that registration allows in 15 minutes.
      - name: Live Express gathering, recipes, crafting settlement and wild pet binding
        if: ${{ matrix.shard == 2 }}
        env:
          LIVE_E2E_REALTIME: '1'
        run: npm run test:e2e:live --prefix shinobij.client -- resource-gathering.spec.ts recipes.spec.ts crafting-lifecycle.spec.ts wild-binding-express.spec.ts --project=chromium-desktop-live --project=chromium-mobile-live --workers=1 --retries=0 --forbid-only --output=test-results/fieldwork-crafting-ci 2>&1 | tee .ci-evidence/e2e-village-stores/fieldwork-crafting.log
      - name: Live Express Exchange and sector-war player journeys
        if: ${{ matrix.shard == 3 }}
        run: npm run test:e2e:live --prefix shinobij.client -- sunscar-exchange-express.spec.ts sector-war-express.spec.ts --project=chromium-desktop-live --retries=1 --output=test-results/economy-war-journeys-ci 2>&1 | tee .ci-evidence/e2e-village-stores/economy-war-journeys.log
      # Two real clients on one realtime server: a desktop mover and a 390x844
      # touch observer that the spec opens itself, so the desktop project covers
      # both. It sat outside CI, so when the sector became the continuous world
      # it broke on main and nothing noticed. Its own step is its own server.
      # The tavern push journey is the same shape (a desktop listener and the
      # spec's own phone speaker) and needs the same realtime server.
      - name: Live Express two-client sector presence and tavern push
        if: ${{ matrix.shard == 3 }}
        env:
          LIVE_E2E_REALTIME: '1'
        run: npm run test:e2e:live --prefix shinobij.client -- connected-sector-presence.spec.ts tavern-chat-push.spec.ts --project=chromium-desktop-live --workers=1 --retries=0 --forbid-only --output=test-results/sector-presence-ci 2>&1 | tee .ci-evidence/e2e-village-stores/sector-presence.log
      # The Hollow Gate "Send pet" duel walks the shrine on both viewports. It
      # sat outside CI, so when PR #347 put hunting wanderers on the first floor
      # it failed 2 runs of 4 and nothing noticed for two days. Its own step is
      # its own server: it opens Moonshadow's Hollow Gate through the admin
      # village state, and it registers one diver per case, 4 of the 25 accounts
      # per IP that registration allows in 15 minutes.
      - name: Live Express Hollow Gate pet duel on desktop and mobile
        if: ${{ matrix.shard == 3 }}
        run: npm run test:e2e:live --prefix shinobij.client -- hollow-gate-pet-duel-express.spec.ts --project=chromium-desktop-live --project=chromium-mobile-live --workers=1 --retries=0 --forbid-only --output=test-results/hollow-gate-pet-duel-ci 2>&1 | tee .ci-evidence/e2e-village-stores/hollow-gate-pet-duel.log
      - name: Retain Village Stores browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: evidence-e2e-village-stores-${{ matrix.shard }}-of-3-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-evidence/e2e-village-stores/
            shinobij.client/playwright-report/
            shinobij.client/test-results/
          if-no-files-found: warn
          retention-days: 14

  e2e_village_stores:
    name: CI / e2e-village-stores
    needs: e2e_village_stores_matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all live Express shards
        env:
          VILLAGE_SHARDS: ${{ needs.e2e_village_stores_matrix.result }}
        run: |
          mkdir -p .ci-evidence/e2e-village-stores-aggregate
          printf 'live-express-shards=%s\n' "$VILLAGE_SHARDS" | tee .ci-evidence/e2e-village-stores-aggregate/results.log
          test "$VILLAGE_SHARDS" = success
      - name: Retain live Express aggregate evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: evidence-e2e-village-stores-aggregate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/e2e-village-stores-aggregate/
          if-no-files-found: warn
          retention-days: 14

  test_build:
    name: CI / test-build
    if: ${{ always() }}
    needs:
      - server_contracts
      - server_build_security
      - pg_integration
      - client_quality
      - release_artifact
      - release_certification
      - concurrency_smoke
      - e2e_responsive
      - e2e_combat
      - e2e_warfront
      - e2e_village_stores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every split gate
        env:
          SERVER_CONTRACTS: ${{ needs.server_contracts.result }}
          SERVER_BUILD_SECURITY: ${{ needs.server_build_security.result }}
          PG_INTEGRATION: ${{ needs.pg_integration.result }}
          CLIENT_QUALITY: ${{ needs.client_quality.result }}
          RELEASE_ARTIFACT: ${{ needs.release_artifact.result }}
          RELEASE_CERTIFICATION: ${{ needs.release_certification.result }}
          CONCURRENCY_SMOKE: ${{ needs.concurrency_smoke.result }}
          E2E_RESPONSIVE: ${{ needs.e2e_responsive.result }}
          E2E_COMBAT: ${{ needs.e2e_combat.result }}
          E2E_WARFRONT: ${{ needs.e2e_warfront.result }}
          E2E_VILLAGE_STORES: ${{ needs.e2e_village_stores.result }}
        run: |
          mkdir -p .ci-evidence/test-build
          printf 'sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .ci-evidence/test-build/provenance.txt
          printf '%s\n' \
            "server-contracts=$SERVER_CONTRACTS" \
            "server-build-security=$SERVER_BUILD_SECURITY" \
            "pg-integration=$PG_INTEGRATION" \
            "client-quality=$CLIENT_QUALITY" \
            "release-artifact=$RELEASE_ARTIFACT" \
            "release-certification=$RELEASE_CERTIFICATION" \
            "concurrency-smoke=$CONCURRENCY_SMOKE" \
            "e2e-responsive=$E2E_RESPONSIVE" \
            "e2e-combat=$E2E_COMBAT" \
            "e2e-warfront=$E2E_WARFRONT" \
            "e2e-village-stores=$E2E_VILLAGE_STORES" \
            | tee .ci-evidence/test-build/results.log
          test "$SERVER_CONTRACTS" = success
          test "$SERVER_BUILD_SECURITY" = success
          test "$PG_INTEGRATION" = success
          test "$CLIENT_QUALITY" = success
          test "$RELEASE_ARTIFACT" = success
          test "$RELEASE_CERTIFICATION" = success
          test "$CONCURRENCY_SMOKE" = success
          test "$E2E_RESPONSIVE" = success
          test "$E2E_COMBAT" = success
          test "$E2E_WARFRONT" = success
          test "$E2E_VILLAGE_STORES" = success
      - name: Retain compatibility aggregate evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          include-hidden-files: true
          name: evidence-test-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/test-build/
          if-no-files-found: warn
          retention-days: 14
