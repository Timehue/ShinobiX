name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    # ~22 min typical, but the full suite + two builds + Playwright browser
    # install + cross-browser smoke + audit can spike past 30 on a slow runner
    # (observed 30m17s → cancelled). 45 gave headroom so timing variance can't
    # cancel an otherwise-green run.
    #
    # 2026-08-15: 45 → 75. The job outgrew 45 too — run 31863101952 ran 45m18s
    # and was cancelled mid "Combat layout and jutsu-arming matrix" (step 21 of
    # 23) with every preceding step green; Root tests alone took 27m. A timeout
    # cancel is WORSE than a slow run: the trailing steps (combat layout matrix,
    # Client audit) silently never execute, so they gate nothing while main shows
    # red. Several main commits carry cancelled runs for this reason, including
    # the one serving production. Raise the ceiling rather than lose the checks;
    # if the job approaches 75, split the Playwright steps into their own
    # parallel job instead of raising this again.
    timeout-minutes: 75
    env:
      # Exercise the same Sentry-enabled bundle path Railway builds. The dummy
      # DSN is public-format test data and sends nothing during build or smoke.
      VITE_SENTRY_DSN: https://public@example.invalid/1
      VITE_SENTRY_RELEASE: ci
      VITE_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The action's own runtime, not ours: v4 ran on Node 20, which the
          # runners now force onto 24 and will stop accepting. node-version
          # below is unrelated — it is the Node this repo builds and tests on.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shinobij.client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: shinobij.client
        run: npm ci

      - name: Root tests
        run: npm test

      - name: Deployment topology contract
        run: npm run check:deployment

      - name: Rollback compatibility contract
        run: npm run check:rollback-readiness

      - name: Backup and restore safety
        run: npm run test:backup

      - name: Mission eligibility catalog
        run: npm run test:mission-eligibility

      - name: Release asset references and decodability
        run: npm run test:release-assets

      - name: Tooling handoff drift
        run: npm run check:tooling-handoffs

      - name: Root audit
        run: npm audit --audit-level=high

      - name: Root build
        run: npm run build

      # Boots the real Express server against the isolated in-memory backend
      # and walks a brand-new account through register → first save → rejected
      # currency forgery → sanitized progression forgery → reward → refresh →
      # relog → retry → stale autosave → Academy spar → two-account PvP create,
      # reconnect, move idempotency, resolution, settlement, and history. Runs
      # after the build so it certifies the built dist/server.js. Needs no
      # database and no secrets.
      - name: Fresh-account and combat release certification
        run: npm run certify:release

      # Short real-server concurrency gate. The longer capacity and staging
      # Postgres soaks remain release-operator checks; this catches handler,
      # auth, lock, server-responsiveness, and harness regressions on every change.
      - name: Local concurrent-player smoke
        run: npm run soak:smoke

      - name: Client lint
        working-directory: shinobij.client
        run: npm run lint

      - name: Client build
        working-directory: shinobij.client
        run: npm run build

      - name: Install release browsers
        working-directory: shinobij.client
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser responsive and accessibility smoke
        working-directory: shinobij.client
        run: npm run test:e2e

      # The real Solo/PvP and Tower combat shells have a wider viewport/DPR/zoom
      # contract than the static responsive smoke. Keep live idle -> arm -> cancel
      # transitions (including an authoritative exact-2v2 Tower match) in the
      # release gate so dynamic guidance or focus cannot rescale either board.
      - name: Combat layout and jutsu-arming matrix
        working-directory: shinobij.client
        env:
          COMBAT_LAYOUT_CAPTURE_PHASE: after
          COMBAT_LAYOUT_STRICT: "1"
          COMBAT_LAYOUT_ARTIFACT_ROOT: ${{ github.workspace }}/shinobij.client/test-results/combat-layout/captures
        run: npm run test:e2e:combat-layout

      - name: Retain combat layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combat-layout-evidence-${{ github.run_id }}
          path: shinobij.client/test-results/combat-layout/
          if-no-files-found: warn
          retention-days: 14

      - name: Client audit
        working-directory: shinobij.client
        run: npm audit --audit-level=high
