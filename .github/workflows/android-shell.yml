name: Android shell

# The Flutter WebView shell in mobile/. Runs only when the shell changes, or
# when a website file it mirrors changes: test/parity_test.dart reads those
# files, so a change on either side that breaks the other fails here.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'shinobij.client/src/lib/surface.ts'
      - 'shinobij.client/src/lib/native-play.ts'
      - 'api/_google-auth.ts'
      - 'api/_canonical-domain.ts'
      - '.github/workflows/android-shell.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shinobij.client/src/lib/surface.ts'
      - 'shinobij.client/src/lib/native-play.ts'
      - 'api/_google-auth.ts'
      - 'api/_canonical-domain.ts'
      - '.github/workflows/android-shell.yml'

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to a full commit SHA (a tag can be moved).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Keep in step with the Flutter the release is built with (mobile/README.md).
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
