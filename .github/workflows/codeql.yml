# CodeQL — ADVANCED setup (replaces GitHub default setup).
#
# CUTOVER IS DONE. Default setup reads `not-configured` (verified 2026-08-28), so
# this workflow's uploads are ingested and it is the only thing scanning the repo.
# If code scanning ever goes quiet, check that first — re-enabling default setup
# makes GitHub reject every advanced-setup upload ("analyses from advanced
# configurations cannot be processed when the default setup is enabled"), which
# shows up as a red check here rather than as a missing-coverage warning:
#
#   gh api repos/:owner/:repo/code-scanning/default-setup --jq .state
#
# Mirrors what default setup ran: languages actions + javascript-typescript,
# the "extended" query suite (see ./.github/codeql/codeql-config.yml), weekly
# schedule. (Python is dropped from the matrix — see the note by `matrix.include`
# below; the repo has no in-scope Python to analyse.) The main behavioural change
# is paths-ignore in that config, dropping the offline dev-script noise. Action
# major tags track the latest majors, matching .github/workflows/ci.yml:
# checkout@v7, codeql-action@v4 (github/codeql-action ships v3 and v4 the same
# day — v4 is simply the current major, so v3 was currency debt, not coverage).
name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 05:31 UTC — matches default setup's weekly cadence.
    - cron: '31 5 * * 1'

concurrency:
  # Per-COMMIT on push, per-branch on pull_request.
  #
  # `cancel-in-progress: false` protects a main scan that is already RUNNING, but
  # it does not protect a QUEUED one: GitHub cancels the previously pending run in
  # a concurrency group whenever a newer run joins it, whatever this flag says. A
  # single `codeql-refs/heads/main` group therefore serialised every push, and
  # since pushes to main land faster than the 20-80 min javascript-typescript
  # analysis, scans sat in that queue and were evicted by the next push. Measured
  # 2026-09-01: of five cancelled main runs, FOUR never started a single job
  # (`/actions/runs/<id>/jobs` -> total_count 0) — they died queued.
  #
  # Every one of those uploads an analysis carrying
  # `error: "unsuccessful execution, exit code: 0"` with rules=0/results=0, which
  # both banners the alerts page and reads as a clean `results=0` scan when it is
  # nothing of the kind. That produced 15 errored, empty analyses on main between
  # 2026-08-02 and 2026-09-01 (deleted 2026-09-01).
  #
  # Keying the group on the SHA gives each pushed commit its own group, so main
  # scans never queue behind one another and each runs to completion. The repo is
  # public, so the extra concurrent runs cost no Actions minutes.
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # PRs still collapse onto the branch head: superseding a PR scan uploads that
  # same errored record, but on a PR ref that is an acceptable trade for not
  # queueing a scan per push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Only this job needs elevated scope; the rest of the repo's Actions run
      # read-only (ci.yml pins contents: read at the top level).
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          # NOTE: no `python` entry. The repo's only .py file is the offline dev
          # helper scripts/_story-pdf-build.py, which paths-ignore excludes — so a
          # python analysis finds zero in-scope source and fails fatally ("no
          # source code seen"). There is no production Python to scan. If real
          # Python is ever added OUTSIDE scripts/, re-add `- language: python`.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
