# CodeQL — ADVANCED setup (replaces GitHub default setup).
#
# ┌─ CUTOVER (one-time, REQUIRED) ────────────────────────────────────────────┐
# │ GitHub refuses to ingest an advanced-setup run while default setup is      │
# │ still enabled ("analyses from advanced configurations cannot be processed  │
# │ when the default setup is enabled"). Before/at the moment this lands on    │
# │ main, disable default setup ONCE:                                          │
# │                                                                            │
# │   gh api -X PATCH repos/:owner/:repo/code-scanning/default-setup \         │
# │     -f state=not-configured                                                │
# │                                                                            │
# │ Fully reversible — re-enable with -f state=configured to fall back.        │
# │ Until then this workflow will run but its upload is rejected (a red check, │
# │ not a coverage gap — default setup keeps scanning main meanwhile).         │
# └────────────────────────────────────────────────────────────────────────────┘
#
# Mirrors what default setup ran: languages actions + javascript-typescript,
# the "extended" query suite (see ./.github/codeql/codeql-config.yml), weekly
# schedule. (Python is dropped from the matrix — see the note by `matrix.include`
# below; the repo has no in-scope Python to analyse.) The main behavioural change
# is paths-ignore in that config, dropping the offline dev-script noise. Action
# major tags (checkout@v7) match
# .github/workflows/ci.yml; codeql-action stays on its current major (v3).
name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 05:31 UTC — matches default setup's weekly cadence.
    - cron: '31 5 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  # PRs only. A cancelled analysis still uploads to code scanning, as an analysis
  # with error "unsuccessful execution, exit code: 0" — which is what puts the
  # "CodeQL is reporting errors" banner on the alerts page. On PRs that is an
  # acceptable trade for not queueing a scan per push; on main it would mark the
  # branch's own configuration as errored, so pushes to main run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Only this job needs elevated scope; the rest of the repo's Actions run
      # read-only (ci.yml pins contents: read at the top level).
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          # NOTE: no `python` entry. The repo's only .py file is the offline dev
          # helper scripts/_story-pdf-build.py, which paths-ignore excludes — so a
          # python analysis finds zero in-scope source and fails fatally ("no
          # source code seen"). There is no production Python to scan. If real
          # Python is ever added OUTSIDE scripts/, re-add `- language: python`.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
