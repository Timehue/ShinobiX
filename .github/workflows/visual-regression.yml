name: Visual regression (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shinobij.client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: shinobij.client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e:visual
      - run: npm run test:e2e:visual:size
      - name: Upload visual diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diagnostics
          path: |
            shinobij.client/test-results/visual
            shinobij.client/playwright-report
          if-no-files-found: ignore
