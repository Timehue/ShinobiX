name: Isolated world boss image qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/world-boss-image-qualification.yml'
      - 'scripts/world-boss-image-qualification/**'

permissions:
  contents: read

concurrency:
  group: isolated-world-boss-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retain:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      recovery_artifact_id: ${{ steps.upload_recovery.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/world-boss-image-qualification
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Resolve reviewed source pins
        id: pins
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pins=JSON.parse(fs.readFileSync("scripts/world-boss-image-qualification/pins.json")); for(const role of ["candidate","recovery"]){const sha=pins[role]; if(!/^[a-f0-9]{40}$/.test(sha))throw Error("Invalid reviewed pin"); fs.appendFileSync(process.env.GITHUB_OUTPUT,role+"="+sha+"\n");}'
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pins.outputs.candidate }}
          persist-credentials: false
          path: source-candidate
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/release-audit/
            !/mobile/
            !/android/
      - name: Build once and export the candidate image
        run: node scripts/world-boss-image-qualification/images.mjs build candidate source-candidate "$RUNNER_TEMP/retained-candidate"
      - uses: actions/upload-artifact@v7
        id: upload_candidate
        with:
          name: world-boss-image-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pins.outputs.recovery }}
          persist-credentials: false
          path: source-recovery
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/
            !/release-audit/
            !/mobile/
            !/android/
      - name: Build once and export the compatible recovery image
        run: node scripts/world-boss-image-qualification/images.mjs build recovery source-recovery "$RUNNER_TEMP/retained-recovery"
      - uses: actions/upload-artifact@v7
        id: upload_recovery
        with:
          name: world-boss-image-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-recovery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  qualify:
    needs: retain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/world-boss-image-qualification
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.retain.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/images/candidate
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.retain.outputs.recovery_artifact_id }}
          path: ${{ runner.temp }}/images/recovery
      - name: Load retained images and qualify on disposable PostgreSQL
        run: node scripts/world-boss-image-qualification/run.mjs "$RUNNER_TEMP/images" "$RUNNER_TEMP/qualification-results"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-boss-image-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-results/
          if-no-files-found: error
          retention-days: 14
