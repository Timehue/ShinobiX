# CodeQL analysis config (advanced setup).
#
# WHY THIS EXISTS: GitHub *default* setup cannot filter paths, so every offline
# dev/asset-generation script under scripts/ and shinobij.client/scripts/ tripped
# the JS taint queries (js/request-forgery, js/file-access-to-http,
# js/user-controlled-bypass, js/path-injection) on the developer's OWN CLI flags,
# env vars, and FAL_KEY. Those scripts are never imported by the server or client
# bundle and never run at request time. Roughly 70% of this repo's ~215 dismissed
# alerts came from exactly these two directories. Excluding them here ends the
# recurring triage tax WITHOUT weakening coverage of shipped code (api/, server.ts,
# shinobij.client/src/**). See docs/SECURITY_PROGRAM.md.
#
# Keep `queries: security-extended` in lockstep with the retired default setup,
# which ran the "extended" suite — do not downgrade to the default suite here.
name: "ShinobiX CodeQL config"

queries:
  - uses: security-extended

# js/log-injection is excluded on purpose. This codebase routes ALL
# request-controlled log values through safeLogValue() (api/_safe-log.ts), which
# strips CR/LF and other control characters. CodeQL does NOT recognize that custom
# helper as a sanitizing barrier — confirmed empirically: it re-flagged all 101
# call sites even after safeLogValue was given an explicit /[\r\n]/g replace and a
# full scan ran. So the query cannot tell sanitized from unsanitized logging here
# and only emits false positives against our own sanitizer. The runtime fix stays;
# we stop scanning a class the engine mis-evaluates in this repo. If safeLogValue
# is ever removed as the logging convention, drop this exclusion.
query-filters:
  - exclude:
      id: js/log-injection

# Paths are relative to the repo root. A bare directory matches everything under
# it. Only OFFLINE developer tooling is excluded — never api/, server.ts, or the
# client source. If a NEW dev-only script dir appears and floods alerts, add it
# here rather than dismissing its alerts one by one.
paths-ignore:
  - scripts
  - shinobij.client/scripts
