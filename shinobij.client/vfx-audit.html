<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Combat VFX Motion Audit</title>
  <link rel="stylesheet" href="/src/index.css" />
  <link rel="stylesheet" href="/src/styles/battle-skin.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #e7edf7;
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 74, 116, .24), transparent 38%),
        #07101b;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    header { padding: 24px 28px 8px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
    p { margin: 7px 0 0; color: #8fa4bc; font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: repeat(4, minmax(190px, 1fr));
      gap: 14px;
      padding: 18px 28px 32px;
      border: 0 !important;
      background: transparent !important;
    }
    .shot {
      position: relative;
      height: 190px;
      overflow: hidden;
      border: 1px solid rgba(125, 166, 211, .18);
      border-radius: 14px;
      background:
        linear-gradient(30deg, transparent 47%, rgba(111, 151, 181, .08) 48% 52%, transparent 53%) 0 0 / 52px 45px,
        linear-gradient(-30deg, transparent 47%, rgba(111, 151, 181, .07) 48% 52%, transparent 53%) 0 0 / 52px 45px,
        radial-gradient(circle at 50% 58%, rgba(30, 58, 75, .8), rgba(8, 19, 31, .98) 68%);
      box-shadow: inset 0 -20px 40px rgba(0,0,0,.28);
    }
    .shot-label {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 50;
      color: #dce9f7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-shadow: 0 2px 5px #000;
    }
    .fighter {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 44px;
      height: 58px;
      translate: -50% -50%;
      border: 2px solid rgba(182, 218, 255, .8);
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(145deg, #64748b, #1f2937 55%, #111827);
      box-shadow: 0 7px 13px rgba(0,0,0,.7), inset 0 0 14px rgba(147,197,253,.28);
    }
    .fighter::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -13px;
      width: 28px;
      height: 28px;
      translate: -50% 0;
      border: 2px solid rgba(182, 218, 255, .8);
      border-radius: 50%;
      background: #334155;
    }
    .pvp-combat-vfx { left: 50%; top: 55%; }
    .peak .pvp-vfx-art,
    .peak .pvp-vfx-asset,
    .peak .pvp-vfx-ring,
    .peak .pvp-vfx-core,
    .peak .pvp-vfx-cut,
    .peak .pvp-vfx-sparks {
      animation-delay: -145ms !important;
      animation-play-state: paused !important;
    }
    @media (max-width: 850px) {
      main { grid-template-columns: repeat(2, minmax(145px, 1fr)); padding: 12px; gap: 10px; }
      header { padding: 18px 14px 6px; }
      .shot { height: 165px; }
    }
  </style>
</head>
<body class="peak">
  <header>
    <h1>Combat VFX Motion Language</h1>
    <p>Impact-frame QA: target silhouette must remain readable under every material family.</p>
  </header>
  <main id="gallery" class="arena-fullscreen shinobi-combat-shell"></main>
  <script type="module">
    const liveMode = new URLSearchParams(window.location.search).has("live");
    if (liveMode) document.body.classList.remove("peak");

    const effects = [
      ["Fire Spiral", "fire60", "ward", "fire60-smart.webp", 1.32, -3, .94, 1],
      ["Water Prison", "water60", "ward", "water60.webp", 1.25, -2, .92, 1],
      ["Wind Vortex", "wind60", "ward", "wind60.webp", 1.22, -3, .92, 1],
      ["Thunder Strike", "lightning60", "ward", "lightning60.webp", 1.18, -6, .94, 1],
      ["Earth Slam", "earth60", "burst", "earth60.webp", 1.25, 2, .92, 1],
      ["Named Weapon", "namedWeapon", "slash", "named-weapon.webp", 1.34, -5, .88, 1],
      ["Shield", "shield", "ward", "shield.webp", 1.42, -7, .86, .92],
      ["Shadow Vortex", "shadow", "burst", "shadow.webp", 1.50, -3, .88, .92],
      ["Burn Status", "burn", "ground", "burn-status-smart.webp", 1.12, 1, .80, .92],
      ["Wound Status", "wound", "burst", "wound-status-smart.webp", 1.12, -2, .82, .92],
      ["Stun Status", "spark", "ward", "spark-status-smart.webp", 1.12, -5, .82, .92],
      ["KO Finisher", "ko", "ground", "ko.webp", 1.15, 1, .90, 1.1],
    ];
    const gallery = document.querySelector("#gallery");
    for (const [label, key, plane, file, assetScale, lift, opacity, scale] of effects) {
      const shot = document.createElement("section");
      shot.className = "shot";
      shot.innerHTML = `
        <b class="shot-label">${label}</b>
        <i class="fighter"></i>
        <span class="pvp-combat-vfx pvp-vfx-${key} pvp-vfx-${scale > 1.05 ? "finisher" : scale > .95 ? "heavy" : "normal"} pvp-vfx-has-asset pvp-vfx-plane-${plane} pvp-combat-vfx-burst"
          style="--vfx-duration:1000ms;--vfx-scale:${scale};--vfx-asset-scale:${assetScale};--vfx-asset-lift:${lift}px;--vfx-asset-opacity:${opacity}">
          <i class="pvp-vfx-art"><img class="pvp-vfx-asset pvp-vfx-asset-${plane}" src="/combat-vfx/${file}" alt=""></i>
          <i class="pvp-vfx-ring"></i><i class="pvp-vfx-core"></i><i class="pvp-vfx-cut"></i><i class="pvp-vfx-sparks"></i>
        </span>`;
      gallery.append(shot);
    }

    if (liveMode) {
      window.setInterval(() => {
        for (const effect of document.querySelectorAll(".pvp-combat-vfx")) {
          effect.replaceWith(effect.cloneNode(true));
        }
      }, 1500);
    }
  </script>
</body>
</html>
